<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StorScale Platform</title>
<style>
  :root { --bg: #f6f7f9; --panel: #fff; --text: #14171c; --muted: #5b6472; --line: #dde1e7; --accent: #0a66d1; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --panel: #171b21; --text: #e8ebef; --muted: #9aa4b2; --line: #2a313a; --accent: #4d9bf0; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 48px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  p.lead { color: var(--muted); margin: 0 0 32px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
  a.card { display: block; padding: 18px 20px; background: var(--panel); border: 1px solid var(--line);
           border-radius: 10px; color: inherit; text-decoration: none; }
  a.card:hover { border-color: var(--accent); }
  a.card h2 { font-size: 16px; margin: 0 0 4px; color: var(--accent); }
  a.card p { margin: 0; color: var(--muted); font-size: 14px; }
  footer { margin-top: 40px; color: var(--muted); font-size: 13px; }
  code { font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>StorScale Platform</h1>
  <p class="lead">Sign in once with Keycloak, then use any of these. Try <code>alice</code> (analysts) or <code>bob</code> (engineers).</p>
  <div class="grid" id="tools"></div>
  <footer>Storage by <a href="https://storscale.io">StorScale Buckets</a>. Trino is also at <code>https://localhost:8443</code> for JDBC and CLI clients.</footer>
</main>
<script>
  const tools = [
    ["notebooks", "Notebooks", "JupyterHub: a notebook server of your own, with your own Buckets credentials."],
    ["dashboards", "SQL and dashboards", "Superset: SQL Lab and dashboards, querying Trino as you."],
    ["pipelines", "Pipelines", "Airflow: pipelines that run as their own service account."],
    ["monitoring", "Monitoring", "Grafana: Buckets' dashboards and alerts."],
    ["access", "Access policies", "Apache Ranger: who may query what (administrators)."],
    ["auth", "Account", "Keycloak: your account and sign-in.", "/realms/lakehouse/account/"],
  ];
  const grid = document.getElementById("tools");
  for (const [sub, name, text, path] of tools) {
    const a = document.createElement("a");
    a.className = "card";
    a.href = `${location.protocol}//${sub}.${location.host}${path || "/"}`;
    a.innerHTML = `<h2></h2><p></p>`;
    a.querySelector("h2").textContent = name;
    a.querySelector("p").textContent = text;
    grid.append(a);
  }
</script>
</body>
</html>
