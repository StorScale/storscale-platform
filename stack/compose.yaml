# StorScale Platform, on one machine: `storscale up` runs this file.
#
# One domain, STORSCALE_DOMAIN (storscale.localhost), on one port,
# STORSCALE_PORT (8800). The gateway serves each tool on a name of its own:
#
#   http://storscale.localhost:8800              the platform: one sign-in, every tool
#   http://auth.storscale.localhost:8800         Keycloak: sign-in for everything
#   http://notebooks.storscale.localhost:8800    JupyterHub
#   http://dashboards.storscale.localhost:8800   Superset
#   http://pipelines.storscale.localhost:8800    Airflow
#   http://monitoring.storscale.localhost:8800   Grafana
#   http://access.storscale.localhost:8800       Apache Ranger (administrators)
#   http://s3.storscale.localhost:8800           Buckets' S3 API
#
# Browsers resolve *.localhost to this machine without a hosts file. Inside
# the stack, the same names resolve to the gateway, so every service uses the
# addresses a browser does, and Keycloak's tokens carry one issuer.
#
# Trino also listens on https://localhost:8443 for JDBC and CLI clients.
#
#   docker compose up -d --wait --build      (what `storscale up` does)
#   docker compose run --rm test             (what `storscale test` does)
#   docker compose down -v                   (what `storscale down --volumes` does)
#
# Every password is in .env, for local use only.
name: storscale

x-urls: &urls
  KEYCLOAK_URL: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
  NOTEBOOKS_URL: http://notebooks.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
  DASHBOARDS_URL: http://dashboards.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
  PIPELINES_URL: http://pipelines.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
  MONITORING_URL: http://monitoring.${STORSCALE_DOMAIN}:${STORSCALE_PORT}

x-tools: &tools
  build: ./tools
  image: storscale-tools
  env_file: .env
  environment:
    <<: *urls
    PYTHONPATH: /tools
  volumes:
    - ./tools:/tools:ro
    - tls:/tls
    - prometheus-token:/token

x-superset: &superset
  build: ./superset/image
  image: storscale-superset
  env_file: .env
  environment:
    <<: *urls
    SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
  volumes:
    - ./superset:/app/pythonpath:ro
    - tls:/tls:ro

x-airflow: &airflow
  build: ./airflow/image
  image: storscale-airflow
  env_file: .env
  environment:
    <<: *urls
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API__BASE_URL: http://pipelines.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
    AIRFLOW__API__PORT: "8090"
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow:8090/execution/
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
    AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "10"
  volumes:
    - ./airflow/webserver_config.py:/opt/airflow/webserver_config.py:ro
    - ./airflow/dags:/opt/airflow/dags:ro
    - tls:/tls:ro

networks:
  default:
    name: storscale   # notebook containers join it (DockerSpawner.network_name)

services:
  # --- The gateway: one domain, a name per tool --------------------------------
  gateway:
    image: caddy:2.11.2-alpine
    environment:
      STORSCALE_DOMAIN: ${STORSCALE_DOMAIN}
      STORSCALE_PORT: ${STORSCALE_PORT}
    volumes:
      - ./gateway/Caddyfile:/etc/caddy/Caddyfile:ro
    ports: ["${STORSCALE_BIND:-127.0.0.1}:${STORSCALE_PORT}:${STORSCALE_PORT}"]
    networks:
      default:
        aliases:
          - ${STORSCALE_DOMAIN}
          - auth.${STORSCALE_DOMAIN}
          - notebooks.${STORSCALE_DOMAIN}
          - dashboards.${STORSCALE_DOMAIN}
          - pipelines.${STORSCALE_DOMAIN}
          - monitoring.${STORSCALE_DOMAIN}
          - access.${STORSCALE_DOMAIN}
          - s3.${STORSCALE_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:${STORSCALE_PORT}/healthz"]
      interval: 5s
      retries: 60

  # --- Identity -------------------------------------------------------------------
  # The realm's signing key, made once and kept: tokens stay valid when
  # Keycloak restarts, and Trino and Buckets keep the keys they've fetched.
  keycloak-keys:
    <<: *tools
    command: ["sh", "-c", "test -s /keys/key.pem || (openssl req -x509 -newkey rsa:2048 -nodes -days 3650 -subj /CN=lakehouse -keyout /keys/key.pem -out /keys/cert.pem && chmod 644 /keys/*.pem)"]
    volumes:
      - keycloak-keys:/keys

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    # The realm (keycloak/realm.json) is imported afresh on each start, with
    # the signing key from keycloak-keys.
    entrypoint: ["bash", "-c"]
    command:
      - |
        export KC_SIGNING_KEY="$$(grep -v -- ----- /keys/key.pem | tr -d '\n')"
        export KC_SIGNING_CERT="$$(grep -v -- ----- /keys/cert.pem | tr -d '\n')"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # One issuer for everyone: tokens name the gateway's address, whoever asks.
      KC_HOSTNAME: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      # The realm's placeholders: people's password, redirect URIs, client secrets.
      STORSCALE_DOMAIN: ${STORSCALE_DOMAIN}
      STORSCALE_PORT: ${STORSCALE_PORT}
      LAKEHOUSE_USER_PASSWORD: ${LAKEHOUSE_USER_PASSWORD}
      JUPYTERHUB_OAUTH_SECRET: ${JUPYTERHUB_OAUTH_SECRET}
      PLATFORM_OAUTH_SECRET: ${PLATFORM_OAUTH_SECRET}
      SUPERSET_OAUTH_SECRET: ${SUPERSET_OAUTH_SECRET}
      GRAFANA_OAUTH_SECRET: ${GRAFANA_OAUTH_SECRET}
      AIRFLOW_OAUTH_SECRET: ${AIRFLOW_OAUTH_SECRET}
      AIRFLOW_PIPELINES_SECRET: ${AIRFLOW_PIPELINES_SECRET}
    volumes:
      - ./keycloak/realm.json:/opt/keycloak/data/import/lakehouse-realm.json:ro
      - keycloak-keys:/keys:ro
    depends_on:
      gateway: {condition: service_healthy}
      keycloak-keys: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 60

  # --- The platform: its web app, and platformd behind it -----------------------------
  platformd:
    image: ${PLATFORMD_IMAGE}
    environment:
      PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      KEYCLOAK_URL: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      KEYCLOAK_DIRECT_URL: http://keycloak:8080
      OIDC_CLIENT_SECRET: ${PLATFORM_OAUTH_SECRET}
    depends_on:
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/usr/bin/platformd", "healthcheck"]
      interval: 5s
      retries: 60

  # --- Storage: Buckets, one server with four drives (one erasure set, EC 2+2) -----
  drives:
    <<: *tools
    command: ["chown", "65532:65532", "/data1", "/data2", "/data3", "/data4"]
    volumes:
      - drive1:/data1
      - drive2:/data2
      - drive3:/data3
      - drive4:/data4

  buckets:
    image: ${BUCKETS_IMAGE}
    command: ["server", "--address", ":9000", "/data1", "/data2", "/data3", "/data4"]
    environment:
      BUCKETS_ROOT_USER: ${BUCKETS_ROOT_USER}
      BUCKETS_ROOT_PASSWORD: ${BUCKETS_ROOT_PASSWORD}
      # People sign in with Keycloak; each of their groups names a Buckets policy.
      MINIO_IDENTITY_OPENID_CONFIG_URL: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}/realms/lakehouse/.well-known/openid-configuration
      MINIO_IDENTITY_OPENID_CLIENT_ID: lakehouse
      MINIO_IDENTITY_OPENID_CLAIM_NAME: groups
    volumes:
      - drive1:/data1
      - drive2:/data2
      - drive3:/data3
      - drive4:/data4
    depends_on:
      drives: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}

  # --- Access: Apache Ranger ---------------------------------------------------------
  ranger-db:
    image: apache/ranger-db:2.9.0
    environment:
      POSTGRES_PASSWORD: ${RANGER_PASSWORD}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_PASSWORD}
    volumes:
      - ranger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ranger"]
      interval: 5s
      retries: 60

  ranger-solr:
    image: apache/ranger-solr:2.9.0
    command: ["solr-precreate", "ranger_audits", "/opt/solr/server/solr/configsets/ranger_audits/"]

  ranger-admin:
    image: apache/ranger:2.9.0
    environment:
      RANGER_DB_TYPE: postgres
      POSTGRES_PASSWORD: ${RANGER_PASSWORD}
      RANGER_DB_USER: rangeradmin
      RANGER_DB_PASSWORD: ${RANGER_PASSWORD}
    volumes:
      - ./ranger/create-ranger-services.py:/home/ranger/scripts/create-ranger-services.py:ro
    depends_on:
      ranger-db: {condition: service_healthy}
      ranger-solr: {condition: service_started}
    healthcheck:
      # unauthenticated, so it never counts toward Ranger's sign-in lockout
      test: ["CMD-SHELL", "curl -sf http://localhost:6080/login.jsp >/dev/null"]
      interval: 10s
      start_period: 120s
      retries: 60

  # --- Setup, before Trino: buckets, policies, accounts; Ranger's people and policies
  setup:
    <<: *tools
    command: ["python", "-u", "/tools/setup/run.py", "base"]
    depends_on:
      keycloak: {condition: service_healthy}
      buckets: {condition: service_started}
      ranger-admin: {condition: service_healthy}

  # --- Tables: Nessie (the Iceberg catalog) and Trino --------------------------------
  nessie:
    image: ghcr.io/projectnessie/nessie:0.108.8
    environment:
      - nessie.version.store.type=ROCKSDB
      - nessie.version.store.persist.rocks.database-path=/home/nessie/catalog
      - nessie.catalog.default-warehouse=warehouse
      - nessie.catalog.warehouses.warehouse.location=s3://warehouse/
      - nessie.catalog.service.s3.default-options.endpoint=http://buckets:9000/
      - nessie.catalog.service.s3.default-options.region=us-east-1
      - nessie.catalog.service.s3.default-options.path-style-access=true
      - nessie.catalog.service.s3.default-options.access-key=urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      - nessie.catalog.secrets.access-key.name=${NESSIE_S3_ACCESS_KEY}
      - nessie.catalog.secrets.access-key.secret=${NESSIE_S3_SECRET_KEY}
    volumes:
      - nessie-data:/home/nessie
    depends_on:
      setup: {condition: service_completed_successfully}

  # Trino's self-signed certificate (Trino accepts tokens only over HTTPS).
  tls:
    <<: *tools
    command: ["sh", "-c", "test -s /tls/trino.pem || (openssl req -x509 -newkey rsa:2048 -nodes -days 365 -subj /CN=trino -addext subjectAltName=DNS:trino,DNS:localhost -keyout /tls/key.pem -out /tls/cert.pem && cat /tls/key.pem /tls/cert.pem > /tls/trino.pem && chmod 644 /tls/*.pem)"]

  # Trino's password file (bcrypt): Superset signs in to Trino as "superset".
  trino-passwords:
    <<: *tools
    command: ["sh", "-c", "htpasswd -B -C 10 -b -c /auth/password.db superset \"$$SUPERSET_TRINO_PASSWORD\" && chmod 644 /auth/password.db"]
    volumes:
      - trino-auth:/auth

  trino:
    image: trinodb/trino:483
    environment:
      KEYCLOAK_URL: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      TRINO_S3_ACCESS_KEY: ${TRINO_S3_ACCESS_KEY}
      TRINO_S3_SECRET_KEY: ${TRINO_S3_SECRET_KEY}
      TRINO_SHARED_SECRET: ${TRINO_SHARED_SECRET}
      RANGER_PLUGIN_PASSWORD: ${RANGER_PLUGIN_PASSWORD}
    volumes:
      - ./trino/config.properties:/etc/trino/config.properties:ro
      - ./trino/password-authenticator.properties:/etc/trino/password-authenticator.properties:ro
      - ./trino/access-control.properties:/etc/trino/access-control.properties:ro
      - ./trino/ranger-trino-security.xml:/etc/trino/ranger-trino-security.xml:ro
      - ./trino/ranger-trino-audit.xml:/etc/trino/ranger-trino-audit.xml:ro
      - ./trino/catalog:/etc/trino/catalog:ro
      - tls:/etc/trino/tls:ro
      - trino-auth:/etc/trino/auth:ro
    ports: ["${STORSCALE_BIND:-127.0.0.1}:8443:8443"]
    mem_limit: 3g
    depends_on:
      tls: {condition: service_completed_successfully}
      trino-passwords: {condition: service_completed_successfully}
      setup: {condition: service_completed_successfully}
      nessie: {condition: service_started}
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/v1/info | grep -q '\"starting\":false'"]
      interval: 5s
      retries: 60

  # --- Setup, once Trino is up: Superset's and Airflow's policies; the sales tables --
  setup-trino:
    <<: *tools
    command: ["python", "-u", "/tools/setup/run.py", "trino"]
    depends_on:
      setup: {condition: service_completed_successfully}
      trino: {condition: service_healthy}

  # --- Notebooks: JupyterHub, a container per person ----------------------------------
  # Builds the image JupyterHub starts for each person, then exits.
  notebook:
    build: {context: ./jupyterhub/image, target: notebook}
    image: storscale-notebook
    command: ["true"]

  jupyterhub:
    build: {context: ./jupyterhub/image, target: hub}
    image: storscale-jupyterhub
    command: ["jupyterhub", "-f", "/etc/jupyterhub/jupyterhub_config.py"]
    environment:
      <<: *urls
      PLATFORM_URL: http://${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      JUPYTERHUB_OAUTH_SECRET: ${JUPYTERHUB_OAUTH_SECRET}
      JUPYTERHUB_CRYPT_KEY: ${JUPYTERHUB_CRYPT_KEY}
    volumes:
      - ./jupyterhub/jupyterhub_config.py:/etc/jupyterhub/jupyterhub_config.py:ro
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock
      - jupyterhub-data:/srv/jupyterhub/data
    depends_on:
      keycloak: {condition: service_healthy}
      setup: {condition: service_completed_successfully}
      notebook: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/hub/health')"]
      interval: 5s
      retries: 60

  # --- Dashboards: Superset ---------------------------------------------------------------
  superset-db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: superset
      POSTGRES_USER: superset
      POSTGRES_PASSWORD: ${SUPERSET_DB_PASSWORD}
    volumes:
      - superset-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U superset -d superset"]
      interval: 5s
      retries: 60

  # Superset's metadata database, roles and permissions, and the Trino database.
  superset-init:
    <<: *superset
    command: ["sh", "-c", "superset db upgrade && superset init && python /app/pythonpath/bootstrap.py"]
    depends_on:
      superset-db: {condition: service_healthy}

  superset:
    <<: *superset
    depends_on:
      superset-init: {condition: service_completed_successfully}
      setup-trino: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8088/health"]
      interval: 5s
      start_period: 30s
      retries: 60

  # --- Pipelines: Airflow -------------------------------------------------------------------
  airflow-db:
    image: postgres:18-bookworm
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 60

  # Airflow's database, and its one secret: the pipelines' Keycloak client.
  airflow-init:
    <<: *airflow
    entrypoint: ["bash", "-c"]
    command:
      - |
        airflow db migrate && airflow fab-db migrate &&
        airflow connections delete keycloak_pipelines >/dev/null 2>&1;
        airflow connections add keycloak_pipelines --conn-type http \
          --conn-host auth.${STORSCALE_DOMAIN} --conn-port ${STORSCALE_PORT} \
          --conn-login airflow-pipelines --conn-password "$$AIRFLOW_PIPELINES_SECRET" \
          --conn-description "The pipelines' Keycloak service account (client credentials)"
    depends_on:
      airflow-db: {condition: service_healthy}

  # The API server and UI.
  airflow:
    <<: *airflow
    command: ["api-server"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}
      setup-trino: {condition: service_completed_successfully}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8090/api/v2/monitor/health"]
      interval: 5s
      start_period: 30s
      retries: 60

  airflow-scheduler:
    <<: *airflow
    command: ["scheduler"]
    depends_on:
      airflow: {condition: service_healthy}

  airflow-dag-processor:
    <<: *airflow
    command: ["dag-processor"]
    depends_on:
      airflow: {condition: service_healthy}

  # --- Monitoring: Prometheus and Grafana -------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.13.4
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/rules.yaml:/etc/prometheus/rules.yaml:ro
      - prometheus-token:/etc/prometheus/token:ro
    depends_on:
      setup: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 5s
      retries: 60

  grafana:
    image: grafana/grafana:13.0.10
    environment:
      GF_SERVER_ROOT_URL: http://monitoring.${STORSCALE_DOMAIN}:${STORSCALE_PORT}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # The platform shows Grafana in a frame; the gateway says which pages may.
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      # People sign in with Keycloak: engineers edit dashboards, analysts view
      # them, and anyone in neither group is refused (role_attribute_strict).
      # The admin account above stays, for when Keycloak is down.
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: grafana
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OAUTH_SECRET}
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: "true"
      # Browsers go through the gateway; Grafana calls Keycloak directly.
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}/realms/lakehouse/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http://keycloak:8080/realms/lakehouse/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://keycloak:8080/realms/lakehouse/protocol/openid-connect/userinfo
      GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH: preferred_username
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_GROUPS_ATTRIBUTE_PATH: groups
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "contains(groups[*], 'engineers') && 'Editor' || contains(groups[*], 'analysts') && 'Viewer'"
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: "true"
      GF_AUTH_GENERIC_OAUTH_SKIP_ORG_ROLE_SYNC: "false"
      GF_AUTH_SIGNOUT_REDIRECT_URL: http://auth.${STORSCALE_DOMAIN}:${STORSCALE_PORT}/realms/lakehouse/protocol/openid-connect/logout
      GF_USERS_DEFAULT_THEME: dark
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards/buckets:ro
    depends_on:
      prometheus: {condition: service_healthy}
      keycloak: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 5s
      retries: 60

  # A little S3 traffic, so the storage dashboards have something to show.
  traffic:
    <<: *tools
    command: ["python", "-u", "/tools/traffic.py"]
    depends_on:
      setup: {condition: service_completed_successfully}

  # --- The end-to-end checks: docker compose run --rm test [suite ...] --------------------
  test:
    <<: *tools
    entrypoint: ["python", "-u", "/tests/run.py"]
    command: []
    profiles: ["test"]
    volumes:
      - ./tools:/tools:ro
      - ./tests:/tests:ro
      - ./monitoring/dashboards:/dashboards:ro
      - tls:/tls
      - drive3:/drive3

  # The shell, in a real browser: docker compose run --rm test-browser
  test-browser:
    image: mcr.microsoft.com/playwright/python:v1.63.0-noble
    command: ["sh", "-c", "pip install -q --root-user-action=ignore playwright==1.63.0 && python -u /tests/shell.py"]
    env_file: .env
    volumes:
      - ./tests:/tests:ro
    profiles: ["test"]

volumes:
  keycloak-keys:
  drive1:
  drive2:
  drive3:
  drive4:
  ranger-db:
  nessie-data:
  tls:
  trino-auth:
  prometheus-token:
  jupyterhub-data:
  superset-db:
  airflow-db:
